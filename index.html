<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Nirmala UI","Noto Sans Bengali",Kalpurush,Arial,sans-serif;background:#f6f5f2;color:#1c1917}
.kraft{background:#a8743f}
.tick{display:inline-flex;white-space:nowrap;will-change:transform;animation:tick var(--d,20s) linear infinite}
.tick span{display:inline-block;box-sizing:border-box;min-width:100vw;padding-right:4rem}

@keyframes tick{from{transform:translateX(0)}to{transform:translateX(-50%)}}

button,select,input,textarea{font:inherit}
:focus-visible{outline:3px solid #a8743f;outline-offset:2px}
</style>

<header class="bg-white border-b border-stone-200 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="kraft w-11 h-11 rounded-xl flex items-center justify-center text-2xl shrink-0">📦</div>
      <div class="min-w-0">

<main class="max-w-7xl mx-auto px-4 py-5 space-y-5">
  <section id="stats" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3"></section>

  <section class="grid lg:grid-cols-3 gap-5">

      <select id="fs" class="border border-stone-300 rounded-xl px-3 py-3 bg-white"><option value="all">Status: All</option><option value="pending">Pending</option><option value="running">Running</option><option value="finished">Finished</option><option value="delivered">Delivered</option><option value="hold">Hold</option></select>

<script>
/* ---------- Setup ---------- */
/* ===== PASTE YOUR SUPABASE VALUES HERE (see SETUP-GUIDE.md) ===== */
const SUPABASE_URL =
  'https://gcjkspgwjqployrwawfv.supabase.co';

const SUPABASE_ANON_KEY =
  'sb_publishable_2x7cM2LtyVw0WGUYbZOxDA_V7X1DpaU';

const EMAIL_DOMAIN = 'almisk.app';

/* ================================================================ */




const configured = SUPABASE_URL.startsWith('https://') && !SUPABASE_ANON_KEY.startsWith('YOUR_');
const sb = configured ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let reads = new Set();
let jobs = [];
let filters = { q: '', s: 'all', p: 'all', d: 'all' };
let delTouched = false;
let shownDate = '';

const STATUS = {
  pending:   { label: 'Pending',   icon: '⏳', cls: 'bg-amber-100 text-amber-900 border-amber-300', next: ['running', 'Start Production'] },
  running:   { label: 'Running',   icon: '⚙️', cls: 'bg-blue-100 text-blue-900 border-blue-300',   next: ['finished', 'Mark Finished'] },
  finished:  { label: 'Finished',  icon: '✅', cls: 'bg-green-100 text-green-900 border-green-300', next: ['delivered', 'Mark Delivered'] },
  delivered: { label: 'Delivered', icon: '🚚', cls: 'bg-emerald-800 text-white border-emerald-900', next: null },
  hold:      { label: 'Hold',      icon: '⏸', cls: 'bg-red-100 text-red-900 border-red-300',       next: ['pending', 'Resume (Pending)'] }
};
const FLOW = ['pending', 'running', 'finished', 'delivered'];
const TYPES = ['Box', 'Bag', 'Sleeve', 'Card', 'Sticker', 'Label', 'Paper Bag', 'Carton', 'Other'];
const UNITS = ['pcs', 'sets', 'kg', 'rolls', 'other'];

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');

/* ---------- Users, roles & permissions ---------- */
const PERMS = [['add','Add new jobs'],['edit','Edit jobs'],['delete','Delete jobs'],['s_pending','Set Pending'],['s_running','Set Running'],
  ['s_finished','Set Finished'],['s_delivered','Set Delivered'],['s_hold','Set Hold'],['notice','Edit notice ticker'],['users','Manage users & roles'],['demo','Demo / clear data']];
const DEFAULT_ROLES = [
  { id: 'admin', name: 'Admin', locked: true, perms: PERMS.map(p => p[0]) },
  { id: 'viewer', name: 'Viewer (view only)', perms: [] },
  { id: 'runner', name: 'Running Operator', perms: ['s_running'] },
  { id: 'finisher', name: 'Finished Operator', perms: ['s_finished'] }
];
let users = [], roles = [], me = null;
// Admin role always has every permission; other roles use their ticked permissions
const can = p => !!me && (me.role === 'admin' || ((roles.find(r => r.id === me.role) || { perms: [] }).perms.includes(p)));
const canAny = j => Object.keys(STATUS).some(s => s !== j.status && can('s_' + s));

const emailOf = uid => uid.includes('@') ? uid : uid + '@' + EMAIL_DOMAIN;
const validUid = u => /^[a-z0-9._-]{3,30}$/.test(u);
const USER_RULE = 'Use a name, a user ID (3-30 letters, numbers, . _ -) and a password of 6+ characters.';
function fail(err) { console.error(err); alert((err && err.message) || err); }

function showSetupHelp() {
  const a = $('auth'); a.style.display = 'flex';
  a.innerHTML = '<div class="bg-white rounded-2xl shadow-xl p-6 max-w-md"><h2 class="font-extrabold text-xl mb-2">Supabase is not set up yet</h2><p class="text-stone-700">Open <b>index.html</b>, find <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> near the top of the script, paste your project values, save and reload. Follow <b>SETUP-GUIDE.md</b>.</p></div>';
}
function showAuth(mode, msg) {
  const setup = false, i = 'border border-stone-300 rounded-xl px-3 py-3 w-full';
  authMode = mode; const a = $('auth'); a.style.display = 'flex';
  a.innerHTML = `<form id="authForm" class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm space-y-3">
    <button type="button" data-act="lang" class="float-right text-sm font-semibold border border-stone-300 rounded-lg px-2 py-1">${lang === 'bn' ? 'English' : 'বাংলা'}</button>
    <div class="text-center"><div class="kraft w-14 h-14 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-2">📦</div>
    <h2 class="font-extrabold text-xl">ALMISK CARTON BOXES</h2>
    <p class="text-sm text-stone-600">${setup ? 'First-time setup: create the Admin account' : 'Sign in to continue'}</p></div>
    ${setup ? `<input id="aName" class="${i}" placeholder="Full name" autocomplete="name">` : ''}
    <input id="aUid" class="${i}" placeholder="User ID or email" autocomplete="username" autocapitalize="none">
    <input id="aPw" type="password" class="${i}" placeholder="Password" autocomplete="${setup ? 'new-password' : 'current-password'}">
    <p id="authErr" class="text-red-700 text-sm font-semibold">${esc(msg || '')}</p>
    <button class="kraft text-white font-bold rounded-xl px-4 py-3 w-full">${setup ? 'Create Admin & Start' : 'Sign In'}</button></form>`;
  translateDom(a);
  $('authForm').onsubmit = async e => {
    e.preventDefault();
    const uid = $('aUid').value.trim().toLowerCase(), pw = $('aPw').value, err = $('authErr'), btn = e.submitter;
    if (!uid || !pw) { err.textContent = t('Enter your user ID and password.'); return; }
    btn.disabled = true; err.textContent = '';
    try {
      if (setup) {
        const name = $('aName').value.trim();
        if (!name || !validUid(uid) || pw.length < 6) { err.textContent = t(USER_RULE); return; }
        const { data, error } = await sb.auth.signUp({ email: emailOf(uid), password: pw, options: { data: { name, user_id: uid } } });
        if (error) { err.textContent = error.message; return; }
        if (!data.session) { err.textContent = t('Turn off "Confirm email" in Supabase (Authentication, Providers, Email), then try again.'); return; }
        await enter(data.user);
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email: emailOf(uid), password: pw });
        if (error) { err.textContent = t('Wrong user ID or password.'); return; }
        await enter(data.user);
      }
    } finally { btn.disabled = false; }
  };
}
async function enter(user) {
  const { data: p } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (!p || !p.approved) { await sb.auth.signOut(); me = null; showAuth('login', t('Your account is not active. Ask the Admin.')); return; }
  me = { id: p.id, name: p.name, userId: p.user_id, role: p.role_id };
  $('auth').style.display = 'none'; $('auth').innerHTML = '';
  await refreshData(); renderAll(); subscribe();
}
async function initAuth() {
  document.documentElement.lang = lang;
  if (!configured) return showSetupHelp();
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && me) { me = null; renderTicker(); showAuth('login'); } });
  const { data } = await sb.auth.getSession();
  if (data.session) return enter(data.session.user);
  showAuth('login');
}
async function logout(msg) {
  me = null; closeModal(); renderTicker();
  if (channel) { sb.removeChannel(channel); channel = null; }
  await sb.auth.signOut(); showAuth('login', typeof msg === 'string' ? msg : '');
}
async function changePassword() {
  const pw = prompt(t('New password (6+ characters):'));
  if (!pw) return;
  if (pw.length < 6) return alert(t('Password must be at least 6 characters.'));
  const { error } = await sb.auth.updateUser({ password: pw });
  alert(error ? error.message : t('Password updated.'));
}

function renderWho() {
  const r = roles.find(x => x.id === me.role), b = 'border border-stone-300 rounded-lg px-3 py-2 font-semibold';
  const un = myNotifs().filter(n => !reads.has(n.id)).length;
  $('whoBar').innerHTML = `<span class="font-semibold">👤 ${esc(me.name)}</span><span class="text-stone-500">${esc(r ? r.name : me.role)}</span>
    <span class="ml-auto flex flex-wrap gap-2 justify-end">
    <button data-act="notifs" aria-label="Notifications" class="${b} relative">🔔${un ? `<span class="absolute -top-2 -right-2 bg-red-600 text-white text-xs rounded-full min-w-[1.25rem] h-5 px-1 flex items-center justify-center">${un}</span>` : ''}</button>
    <button data-act="lang" class="${b}">${lang === 'bn' ? 'English' : 'বাংলা'}</button>
    ${can('users') ? `<button data-act="users" class="${b}">Users &amp; Roles</button>` : ''}
    <button data-act="chgPw" class="${b}">Password</button>
    <button data-act="logout" class="${b}">Sign out</button></span>`;
  $('btnAdd').style.display = can('add') ? '' : 'none';
  $('adminFooter').style.display = can('demo') ? '' : 'none';
}
function statusSelect(j) {
  const opts = Object.keys(STATUS).filter(s => s === j.status || can('s_' + s));
  if (opts.length < 2) return '';
  return `<select data-act="status" data-id="${j.id}" aria-label="Change status" class="border border-stone-300 rounded-xl px-3 py-3 bg-white font-semibold">
    ${opts.map(s => `<option value="${s}" ${s === j.status ? 'selected' : ''}>${STATUS[s].label}</option>`).join('')}</select>`;
}
function whoLine(j) {
  const h = j.history || [], l = h[h.length - 1];
  return (lang === 'bn' ? 'অর্ডার দিয়েছেন' : 'Placed by') + ` <b>${esc(j.createdBy || '—')}</b>` + (h.length > 1 ? (lang === 'bn' ? ` · ${t(STATUS[l.status].label)} — <b>${esc(l.by)}</b> দ্বারা` : ` · ${STATUS[l.status].label} set by <b>${esc(l.by)}</b>`) : '');
}

async function openUsers(msg) {
  if (can('users')) await loadUsers();
  const ro = sel => roles.map(r => `<option value="${r.id}" ${r.id === sel ? 'selected' : ''}>${esc(r.name)}</option>`).join('');
  const i = 'border border-stone-300 rounded-xl px-3 py-2 w-full bg-white', b = 'border border-stone-300 rounded-lg px-3 py-2 font-semibold bg-white';
  openModal(`<div class="flex justify-between"><h3 class="text-xl font-bold">Users &amp; Roles</h3><button data-act="close" aria-label="Close" class="text-2xl text-stone-500">✕</button></div>
    <p class="text-red-700 text-sm font-semibold mt-1">${esc(msg || '')}</p>
    <h4 class="font-bold mt-3 mb-2">Users</h4><div class="space-y-2">${users.map(u => `<div class="border border-stone-200 rounded-xl p-3 flex flex-wrap items-center gap-2">
      <div class="flex-1 min-w-[8rem]"><b>${esc(u.name)}</b><div class="text-xs text-stone-500">ID: ${esc(u.userId)}${u.approved ? '' : ' · ' + t('Disabled')}</div></div>
      <select data-act="setRole" data-id="${u.id}" class="border border-stone-300 rounded-lg px-2 py-2 bg-white" ${u.id === me.id ? 'disabled' : ''}>${ro(u.role)}</select>
      
      ${u.id === me.id ? '' : u.approved ? `<button data-act="delUser" data-id="${u.id}" class="${b} text-red-700">Disable</button>` : `<button data-act="enableUser" data-id="${u.id}" class="${b}">Enable</button>`}</div>`).join('')}</div>
    <h4 class="font-bold mt-4 mb-2">Add user</h4><p class="text-sm text-stone-600">For security, create staff accounts in Supabase Authentication → Users → Add user, using their real email (or userid@almisk.app if managed internally). Then return here to approve and set the role.</p><div class="hidden grid grid-cols-2 gap-2">
      <input id="uName" class="${i}" placeholder="Full name"><input id="uId" class="${i}" placeholder="User ID" autocapitalize="none">
      <input id="uPw" type="password" class="${i}" placeholder="Password (6+ chars)"><select id="uRole" class="${i}">${ro('viewer')}</select></div>

    <h4 class="font-bold mt-5 mb-2">Roles</h4><div class="space-y-2">${roles.map(r => `<div class="border border-stone-200 rounded-xl p-3 flex items-center gap-2">
      <div class="flex-1 text-sm"><b>${esc(r.name)}</b><div class="text-stone-500">${r.locked ? 'Full access' : r.perms.length ? r.perms.map(k => t(PERMS.find(p => p[0] === k)[1])).join(', ') : 'View only'}</div></div>
      <label class="flex items-center gap-1 text-sm"><input type="checkbox" data-act="roleNotify" data-id="${r.id}" class="w-5 h-5" ${r.notify !== false ? 'checked' : ''}>Receives notifications</label>
      ${r.locked ? '' : `<button data-act="delRole" data-id="${r.id}" class="${b} text-red-700">Delete</button>`}</div>`).join('')}</div>
    <h4 class="font-bold mt-4 mb-2">Create a role <span class="font-normal text-sm text-stone-500">(everyone can view jobs)</span></h4>
    <input id="rName" class="${i}" placeholder="Role name, e.g. Delivery Driver">
    <div class="grid grid-cols-2 gap-1 mt-2 text-sm">${PERMS.map(p => `<label class="flex items-center gap-2 py-1"><input type="checkbox" class="rp w-5 h-5" value="${p[0]}">${p[1]}</label>`).join('')}</div>
    <label class="flex items-center gap-2 text-sm mt-2"><input type="checkbox" id="rNotify" class="w-5 h-5" checked>Receives notifications</label>
    <button data-act="addRole" class="kraft text-white rounded-xl px-4 py-2 font-bold mt-2">Add Role</button>`);
}
async function addRole() {
  const name = $('rName').value.trim();
  if (!name) return openUsers(t('Enter a role name.'));
  const { error } = await sb.from('roles').insert({ id: 'r' + Date.now(), name, notify: $('rNotify').checked, perms: [...document.querySelectorAll('.rp:checked')].map(c => c.value) });
  await loadRoles(); renderAll(); openUsers(error ? error.message : '');
}
async function delRole(id) {
  if (users.some(u => u.role === id)) return openUsers(t('This role is assigned to a user. Change their role first.'));
  const { error } = await sb.from('roles').delete().eq('id', id);
  await loadRoles(); openUsers(error ? error.message : '');
}

let lang = localStorage.getItem('almiskLang') === 'bn' ? 'bn' : 'en';
let authMode = 'login', notifs = [];
const LOC = () => lang === 'bn' ? 'bn-BD' : 'en-GB';
const BN = {
 'Packaging Production Control':'প্যাকেজিং প্রোডাকশন কন্ট্রোল','Add New Job':'নতুন জব যোগ করুন','Attention Required':'মনোযোগ প্রয়োজন',
 "Today's Production Overview":'আজকের প্রোডাকশন ওভারভিউ','Recently Delivered':'সম্প্রতি ডেলিভারি হয়েছে','Production Jobs':'প্রোডাকশন জব তালিকা',
 'Load Demo Data':'ডেমো ডেটা লোড করুন','Clear All Data':'সব ডেটা মুছুন','Search jobs…':'জব খুঁজুন…','Status: All':'স্ট্যাটাস: সব',
 'Priority: All':'অগ্রাধিকার: সব','Delivery: All':'ডেলিভারি: সব','Urgent':'জরুরি','Normal':'সাধারণ','Due Today':'আজ ডেলিভারি',
 'Due Tomorrow':'আগামীকাল ডেলিভারি','Overdue':'বিলম্বিত','Pending':'পেন্ডিং','Running':'চলমান','Finished':'সম্পন্ন','Delivered':'ডেলিভারি হয়েছে',
 'Hold':'হোল্ড','Total Jobs':'মোট জব','Jobs Today':'আজকের জব','Sign out':'সাইন আউট','Users & Roles':'ইউজার ও রোল','Ordered':'অর্ডার',
 'Delivery':'ডেলিভারি','View':'দেখুন','Edit':'এডিট','Delete':'ডিলিট','Start Production':'প্রোডাকশন শুরু করুন','Mark Finished':'সম্পন্ন করুন',

// Translate everything on screen. Original text is remembered so switching back to English restores it.
function translateDom(root = document.body) {
  const bn = lang === 'bn', w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    if (/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)) continue;
    if (n._o === undefined) { if (!bn) continue; n._o = n.nodeValue; }
    if (!bn) { n.nodeValue = n._o; continue; }
    const m = n._o.match(/^([^A-Za-z0-9]*)(.*?)(\s*)$/s);
    n.nodeValue = digits(m[1] + (BN[m[2]] ?? m[2]) + m[3]);
  }
  root.querySelectorAll('[placeholder]').forEach(el => {
    if (el._p === undefined) el._p = el.placeholder;
    el.placeholder = bn ? digits(BN[el._p] ?? el._p) : el._p;
  });
}

  lang = l; localStorage.setItem('almiskLang', l); document.documentElement.lang = l; closeModal();

  switch (j.status) {
    case 'pending': return d < 0 ? 'ডেলিভারির তারিখ পেরিয়ে গেছে। অনুগ্রহ করে এখনই এই প্রোডাকশনকে অগ্রাধিকার দিন।'

    case 'running': return d < 0 ? 'প্রোডাকশন চলছে কিন্তু ডেলিভারির তারিখ পেরিয়ে গেছে। অনুগ্রহ করে এখনই শেষ করুন।'
      : d === 0 ? 'প্রোডাকশন চলছে এবং আজ ডেলিভারির দিন। অনুগ্রহ করে শেষ করাকে অগ্রাধিকার দিন।'
      : `সময়মতো প্রোডাকশন শুরু করার জন্য ধন্যবাদ। আমাদের হাতে ${d} দিন আছে। আশা করি সময়মতো শেষ করতে পারব।`;
    case 'finished': return (j.finishedOn || today()) <= j.deliveryDate ? 'সময়মতো কাজ শেষ করার জন্য ধন্যবাদ। ডেলিভারির জন্য প্রস্তুত।' : 'কাজ শেষ হয়েছে, কিন্তু ডেলিভারির সময়সীমা মিস হয়েছে।';
    case 'delivered': return (j.deliveredOn || today()) <= j.deliveryDate ? 'সময়মতো অর্ডার ডেলিভারি করার জন্য ধন্যবাদ।' : 'অর্ডার ডেলিভারি হয়েছে, কিন্তু ডেলিভারির সময়সীমা মিস হয়েছে।';
    default: return 'সবকিছু নিশ্চিত না হওয়া পর্যন্ত অনুগ্রহ করে প্রোডাকশন শুরু করবেন না।';

async function saveNotice(remove) {
  if (!can('notice')) return;
  const text = remove ? '' : $('nText').value.trim();

    ? await sb.from('notice').upsert({ id: 1, text, urgent: $('nUrgent').checked })   // database tells every role
    : await sb.from('notice').delete().eq('id', 1);

  const b = { pending: 'এখন পেন্ডিং', running: 'প্রোডাকশন শুরু হয়েছে', finished: 'প্রোডাকশন শেষ হয়েছে, ডেলিভারির জন্য প্রস্তুত', delivered: 'ডেলিভারি করা হয়েছে', hold: 'হোল্ডে রাখা হয়েছে' };

const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((utc(a) - utc(b)) / 864e5);

/* ---------- Business logic ---------- */
function calculateRemainingDays(j) { return dayDiff(j.deliveryDate, today()); }

function countdown(j) {
  if (j.status === 'delivered') return { text: t('Delivered'), cls: 'text-emerald-800' };
  const d = calculateRemainingDays(j);
  if (d < 0) return { text: lang === 'bn' ? `${-d} দিন বিলম্বিত` : `${-d} ${-d === 1 ? 'DAY' : 'DAYS'} OVERDUE`, cls: 'text-red-700' };
  if (d === 0) return { text: lang === 'bn' ? 'আজ ডেলিভারি' : 'DUE TODAY', cls: 'text-orange-700' };
  return { text: lang === 'bn' ? `${d} দিন বাকি` : `${d} ${d === 1 ? 'DAY' : 'DAYS'} LEFT`, cls: d === 1 ? 'text-amber-700' : 'text-stone-700' };
}

// Used if the user did not type a note
function generateAutomaticNote(j) { return lang === 'bn' ? autoNoteBn(j) : autoNoteEn(j); }
function autoNoteEn(j) {
  const d = calculateRemainingDays(j);
  const left = d === 1 ? 'only 1 day' : `${d} days`;
  switch (j.status) {
    case 'pending':
      if (d < 0) return 'Delivery date has passed. Please prioritize this production immediately.';
      if (d === 0) return 'Please start the production. Delivery is due today.';
      return `Please start the production. We have ${left === 'only 1 day' ? 'only 1 day' : left} remaining before the delivery date.`;
    case 'running':
      if (d < 0) return 'Production is running but the delivery date has passed. Please finish immediately.';
      if (d === 0) return 'Production is running and the delivery is due today. Please prioritize completion.';
      return `Thanks for starting the production on time. We have ${d} ${d === 1 ? 'day' : 'days'} remaining. I hope we will finish on time.`;
    case 'finished':
      return (j.finishedOn || today()) <= j.deliveryDate
        ? 'Thanks for finishing the job on time. Ready for delivery.'
        : 'Job finished, but the delivery deadline was missed.';
    case 'delivered':
      return (j.deliveredOn || today()) <= j.deliveryDate
        ? 'Thanks for delivering the order on time.'
        : 'Order delivered, but the delivery deadline was missed.';
    default:
      return 'Please don’t start production before everything is confirmed.';
  }
}

// Active jobs: overdue → urgent → due today → nearest delivery → latest added. Delivered last.
function rank(j) {
  return ({pending:0, running:1, hold:2, finished:3, delivered:4})[j.status] ?? 5;
}
function sortJobs(list) {
  return [...list].sort((a,b) => {
    const x = rank(a) - rank(b);
    if (x) return x;
    if (a.priority !== b.priority) return a.priority === 'urgent' ? -1 : 1;
    return a.deliveryDate.localeCompare(b.deliveryDate) || a.createdAt.localeCompare(b.createdAt);
  });
}

function searchJobs(list) {
  const q = filters.q.trim().toLowerCase();
  if (!q) return list;
  return list.filter(j => j.companyName.toLowerCase().includes(q) || j.id.toLowerCase().includes(q) ||
    j.items.some(i => i.type.toLowerCase().includes(q)));
}
function filterJobs(list) {
  return list.filter(j => {
    if (filters.s !== 'all' && j.status !== filters.s) return false;
    if (filters.p !== 'all' && j.priority !== filters.p) return false;
    if (filters.d !== 'all') {
      if (j.status === 'delivered') return false;
      const d = calculateRemainingDays(j);
      if (filters.d === 'today' && d !== 0) return false;
      if (filters.d === 'tomorrow' && d !== 1) return false;
      if (filters.d === 'overdue' && d >= 0) return false;
    }
    return true;
  });
}

/* ---------- Actions (saved in Supabase; the database re-checks every permission) ---------- */
async function updateStatus(id, status) {
  if (!can('s_' + status)) return;
  const { error } = await sb.from('jobs').update({ status }).eq('id', id);
  if (error) fail(error);
  await refreshData(); renderAll();
}
async function addJob(data) {
  if (!can('add')) return false;
  const { error } = await sb.from('jobs').insert(toRow(data));
  if (error) { fail(error); return false; }
  await refreshData(); renderAll(); return true;
}
async function editJob(id, data) {
  const j = jobs.find(x => x.id === id);
  if (!j || !can('edit')) return false;
  if (data.status !== j.status && !can('s_' + data.status)) data.status = j.status;
  const { error } = await sb.from('jobs').update(toRow(data)).eq('id', id);
  if (error) { fail(error); return false; }
  await refreshData(); renderAll(); return true;
}
async function deleteJob(id) {
  if (!can('delete')) return;
  if (!(await removeAllJobFiles([id]))) return;
  const { error } = await sb.from('jobs').delete().eq('id', id);
  if (error) fail(error);
  await refreshData(); renderAll();
}

  if (!(await removeAllJobFiles(jobs.map(j => j.id)))) return;

}

      <div class="rounded-xl border border-stone-200 divide-y">${j.items.map(i => `<div class="flex justify-between px-3 py-2"><b>${esc(t(i.type))}</b><span>${esc(i.quantity)} ${esc(t(i.unit))}</span></div>`).join('')}</div>
      <div class="grid grid-cols-2 gap-2 text-sm"><div class="bg-stone-50 rounded-xl p-3">Order date<br><b>${showDate(j.orderDate)}</b></div><div class="bg-stone-50 rounded-xl p-3">Delivery date<br><b>${showDate(j.deliveryDate)}</b></div>
      <div class="bg-stone-50 rounded-xl p-3">Finished on<br><b>${showDate(j.finishedOn)}</b></div><div class="bg-stone-50 rounded-xl p-3">Delivered on<br><b>${showDate(j.deliveredOn)}</b></div></div>
      ${stepper(j)}${noteBlock(j)}
      <div class="text-sm"><b>Placed by:</b> ${esc(j.createdBy || '—')}</div>
      <ul class="text-sm space-y-1 border-t pt-2">${(j.history || []).map(h => `<li>${t(STATUS[h.status].label)} — <b>${esc(h.by)}</b>, ${new Date(h.at).toLocaleString(LOC())}</li>`).join('') || '<li class="text-stone-500">No status history yet.</li>'}</ul>
      <p class="text-xs text-stone-500">${t('Created')} ${new Date(j.createdAt).toLocaleString(LOC())} · ${t('Updated')} ${new Date(j.updatedAt).toLocaleString(LOC())}</p>
      <section class="border-t pt-4" aria-label="Job attachments">
        <h4 class="font-bold mb-2">📎 Artwork / Attachments</h4>
        <div id="jobFiles" class="space-y-2 text-sm text-stone-600">Loading files…</div>
        ${can('add') || can('edit') ? `<label class="block mt-3 font-semibold text-sm">Upload JPG, PNG, WEBP or PDF (up to 10 MB each)
          <input type="file" id="jobUpload" data-job="${esc(j.id)}" accept="image/jpeg,image/png,image/webp,application/pdf" multiple class="block mt-2 text-sm max-w-full" />
        </label><p id="uploadMsg" class="text-sm mt-1" role="status"></p>` : ''}
      </section>
      <div class="flex flex-wrap gap-2 border-t pt-4">
        <button data-act="print" data-id="${esc(j.id)}" class="kraft text-white font-bold rounded-xl px-4 py-3">🖨 Print A4 / Save PDF</button>
      </div>
    </div>
    ${can('edit') ? `<div class="flex gap-3 justify-end mt-4"><button data-act="edit" data-id="${j.id}" class="kraft text-white rounded-xl px-5 py-3 font-bold">Edit</button></div>` : ''}`);
  loadJobAttachments(id);
}


/* ---------- Private job attachments / A4 print ---------- */
const ALLOWED_MIME = new Set(['image/jpeg','image/png','image/webp','application/pdf']);
const EXT = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','application/pdf':'pdf'};
const uploadPermission = () => can('add') || can('edit');
const deleteFilePermission = () => can('edit') || can('delete');
async function listAttachments(jobId) {
  const { data, error } = await sb.from('job_attachments').select('*').eq('job_id',jobId).order('created_at');
  if (error) throw error;
  return data || [];
}
async function fileLink(path) {
  const { data,error } = await sb.storage.from('job-attachments').createSignedUrl(path, 3600);
  if (error) throw error;
  return data.signedUrl;
}
async function loadJobAttachments(jobId) {
  const target = $('jobFiles');
  if (!target) return;
  try {
    const files = await listAttachments(jobId);
    if (!$('jobFiles') || !$('jobUpload') && !document.querySelector('#jobFiles')) return;
    const links = await Promise.all(files.map(async f => ({...f, url: await fileLink(f.storage_path)})));
    const holder = $('jobFiles'); if (!holder) return;
    holder.innerHTML = links.length ? links.map(f => `<div class="border rounded-xl p-3 flex flex-wrap gap-3 items-center">
      ${f.mime_type.startsWith('image/') ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(f.url)}" class="w-24 h-24 object-contain bg-stone-100 rounded" alt="${esc(f.original_name)}" /></a>` : '<span class="text-3xl">📄</span>'}
      <div class="min-w-0 flex-1"><div class="font-semibold break-all">${esc(f.original_name)}</div>
        <a class="text-blue-700 underline" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">View / Download</a></div>
      ${deleteFilePermission() ? `<button data-act="removeAttachment" data-id="${esc(jobId)}" data-file="${esc(f.id)}" class="text-red-700 font-semibold border border-red-200 px-3 py-2 rounded-lg">Remove</button>` : ''}
    </div>`).join('') : '<p>No attachments for this job yet.</p>';
  } catch(e) { if ($('jobFiles')) $('jobFiles').textContent = 'Could not load attachments: ' + e.message; }
}
async function uploadJobAttachments(jobId, selected) {
  if (!uploadPermission()) return;
  const files = [...selected]; const msg = $('uploadMsg');
  if (!files.length) return;
  for (const f of files) {
    if (!ALLOWED_MIME.has(f.type) || !f.size || f.size > 10*1024*1024) {
      if (msg) msg.textContent = `Invalid file: ${f.name} (JPG, PNG, WEBP, PDF; maximum 10 MB).`;
      return;
    }
  }
  if (msg) msg.textContent = `Uploading ${files.length} file(s)…`;
  let successful=0;
  for (const f of files) {
    const uid = crypto.randomUUID();
    const path = `${jobId}/${uid}.${EXT[f.type]}`;
    try {
      const {error:uploadError} = await sb.storage.from('job-attachments').upload(path,f,{contentType:f.type,upsert:false});
      if (uploadError) throw uploadError;
      const {error:dbError} = await sb.from('job_attachments').insert({job_id:jobId,storage_path:path,original_name:f.name.slice(0,240),mime_type:f.type,size_bytes:f.size});
      if (dbError) {
        await sb.storage.from('job-attachments').remove([path]);
        throw dbError;
      }
      successful++;
    } catch(e) { if (msg) msg.textContent = `Uploaded ${successful}. Failed on ${f.name}: ${e.message}`; await loadJobAttachments(jobId); return; }
  }
  if (msg) msg.textContent = `${successful} file(s) uploaded.`;
  if ($('jobUpload')) $('jobUpload').value = '';
  await loadJobAttachments(jobId);
}
async function deleteAttachment(fileId,jobId) {
  if (!deleteFilePermission() || !confirm('Remove this attachment permanently?')) return;
  try {
    const files=await listAttachments(jobId), f=files.find(x=>x.id===fileId);
    if (!f) throw new Error('Attachment not found');
    const {error:e1}=await sb.storage.from('job-attachments').remove([f.storage_path]);
    if(e1) throw e1;
    const {error:e2}=await sb.from('job_attachments').delete().eq('id',f.id);
    if(e2) throw e2;
    await loadJobAttachments(jobId);
  } catch(e) { fail(e); }
}
async function removeAllJobFiles(ids) {
  if (!ids.length) return true;
  try {
    for (const id of ids) {
      const files = await listAttachments(id);
      if (!files.length) continue;
      const {error:e1}=await sb.storage.from('job-attachments').remove(files.map(f=>f.storage_path));
      if(e1) throw e1;
      const {error:e2}=await sb.from('job_attachments').delete().eq('job_id',id);
      if(e2) throw e2;
    }
    return true;
  } catch(e) { fail(e); return false; }
}
function htmlSafe(s) { return esc(s); }
async function printJob(jobId) {
  const j=jobs.find(x=>x.id===jobId); if(!j) return;
  // Open the window immediately inside the user click so popup blockers do not reject it.
  const w=window.open('','_blank');
  if(!w) return alert('Please allow popups to print your A4 job order.');
  w.document.write('<!doctype html><title>Preparing A4 job order…</title><p style="font:16px Arial;padding:20px">Preparing job sheet and attachments…</p>');
  try {
    const files=await listAttachments(jobId);
    const resolved=await Promise.all(files.map(async f=>({...f,url:await fileLink(f.storage_path)})));
    const rows=j.items.map((i,n)=>`<tr><td>${n+1}</td><td>${htmlSafe(i.type)}</td><td>${htmlSafe(i.quantity)}</td><td>${htmlSafe(i.unit)}</td></tr>`).join('');
    const imageSheets=resolved.filter(f=>f.mime_type.startsWith('image/')).map(f=>`<div class="art"><img src="${htmlSafe(f.url)}" alt="${htmlSafe(f.original_name)}"><p>${htmlSafe(f.original_name)}</p></div>`).join('');
    const pdfList=resolved.filter(f=>f.mime_type==='application/pdf').map(f=>`<li><a href="${htmlSafe(f.url)}" target="_blank" rel="noopener">${htmlSafe(f.original_name)}</a> — separate PDF attachment</li>`).join('');
    const hist=(j.history||[]).map(h=>`<li>${htmlSafe(STATUS[h.status]?.label||h.status)} — ${htmlSafe(h.by)} — ${htmlSafe(new Date(h.at).toLocaleString('en-GB'))}</li>`).join('');
    w.document.open(); w.document.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>${htmlSafe(j.id)} A4 Job Order</title><style>
      @page{size:A4;margin:12mm}body{font:12px Arial,sans-serif;color:#1c1917}header{border-bottom:3px solid #a8743f;padding-bottom:12px;margin-bottom:14px;display:flex;justify-content:space-between}h1{font-size:21px;margin:0}h2{font-size:14px;color:#815225;margin:20px 0 8px}.sub{font-size:10px;color:#555}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.panel{border:1px solid #ccc;padding:10px;min-height:45px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #aaa;padding:8px;text-align:left}th{background:#eee}.note{padding:12px;background:#f7f3ee;border:1px solid #ded6cd;white-space:pre-wrap}.art{display:inline-block;vertical-align:top;width:46%;margin:1%;break-inside:avoid}.art img{display:block;width:100%;max-height:90mm;object-fit:contain;border:1px solid #ddd}.art p{overflow-wrap:anywhere;font-size:10px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:25px;margin-top:35px}.sign div{border-top:1px solid #777;padding-top:8px}li{margin:4px 0;overflow-wrap:anywhere}button{padding:9px 16px;background:#a8743f;color:white;border:0;cursor:pointer}@media print{.no-print{display:none!important}} </style></head><body>
      <div class="no-print"><button onclick="window.print()">Print / Save PDF (A4)</button> <span>In your browser print dialog choose Save as PDF if needed.</span></div>
      <header><div><h1>ALMISK CARTON BOXES</h1><div class="sub">Packaging Production Control — Job Order</div></div><div><b>${htmlSafe(j.id)}</b><br>${htmlSafe(new Date().toLocaleString('en-GB'))}</div></header>
      <div class="grid"><div class="panel"><b>Customer / Company</b><p>${htmlSafe(j.companyName)}</p></div><div class="panel"><b>Status / Priority</b><p>${htmlSafe(STATUS[j.status].label)} / ${htmlSafe(j.priority.toUpperCase())}</p></div>
      <div class="panel"><b>Order date:</b> ${showDate(j.orderDate)}<br><b>Delivery date:</b> ${showDate(j.deliveryDate)}</div><div class="panel"><b>Created by:</b> ${htmlSafe(j.createdBy||'—')}<br><b>Finished:</b> ${showDate(j.finishedOn)}<br><b>Delivered:</b> ${showDate(j.deliveredOn)}</div></div>
      <h2>Packaging Items</h2><table><thead><tr><th>#</th><th>Type</th><th>Quantity</th><th>Unit</th></tr></thead><tbody>${rows}</tbody></table>
      <h2>Production Note</h2><div class="note">${htmlSafe(j.note?.trim()||generateAutomaticNote(j))}</div>
      <h2>Production Status History</h2><ul>${hist}</ul>
      ${resolved.length?`<h2>Attached Artwork / PDFs</h2>${imageSheets}${pdfList?`<ul>${pdfList}</ul>`:''}`:''}
      <div class="sign"><div>Customer Approval / Signature</div><div>Production Approval / Signature</div></div>
      <p class="sub">Printed from ALMISK Production Control • Attachments are linked for authorized access</p>
      </body></html>`); w.document.close();
  } catch(e) { w.document.body.innerHTML='<p>Could not prepare print view: '+htmlSafe(e.message)+'</p>'; }
}

/* ---------- Events ---------- */
document.addEventListener('click', e => {
  if (e.target === $('modal')) return closeModal();
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'add': openForm(); break;
    case 'edit': openForm(id); break;
    case 'view': openView(id); break;
    case 'print': printJob(id); break;
    case 'removeAttachment': deleteAttachment(el.dataset.file, id); break;
    case 'quick': updateStatus(id, el.dataset.to); break;
    case 'del': confirmBox('Are you sure you want to delete this job?', 'Delete Job', () => deleteJob(id)); break;
    case 'demo': if (!can('demo')) break; jobs.length ? confirmBox('Demo data will replace your current jobs. Continue?', 'Replace with Demo', loadDemo) : loadDemo(); break;
    case 'clear': if (!can('demo')) break; confirmBox('Delete ALL jobs? This cannot be undone.', 'Clear All Data', clearJobs); break;
    case 'addItem': $('items').insertAdjacentHTML('beforeend', itemRow()); break;
    case 'rmItem': if (document.querySelectorAll('.item-row').length > 1) el.closest('.item-row').remove(); break;
    case 'save': saveForm(); break;
    case 'notice': openNoticeForm(); break;
    case 'saveNotice': saveNotice(); break;
    case 'delNotice': saveNotice(true); break;
    case 'lang': setLang(lang === 'bn' ? 'en' : 'bn'); break;
    case 'notifs': if (me) openNotifs(); break;
    case 'enableAlerts': try { Notification.requestPermission().then(openNotifs); } catch (x) {} break;
    case 'users': if (can('users')) openUsers(); break;
    case 'logout': logout(); break;

    case 'chgPw': changePassword(); break;
    case 'enableUser': if (can('users')) sb.from('profiles').update({ approved: true }).eq('id', id).then(() => openUsers()); break;
    case 'delUser': if (can('users')) confirmBox('Disable this user? They will no longer be able to sign in.', 'Disable User', async () => { await sb.from('profiles').update({ approved: false }).eq('id', id); openUsers(); }); break;
    case 'addRole': if (can('users')) addRole(); break;
    case 'delRole': if (can('users')) delRole(id); break;
    case 'close': closeModal(); break;
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'jobUpload') uploadJobAttachments(e.target.dataset.job, e.target.files);
  if (e.target.dataset.act === 'status') updateStatus(e.target.dataset.id, e.target.value);
  if (e.target.dataset.act === 'roleNotify' && can('users')) { sb.from('roles').update({ notify: e.target.checked }).eq('id', e.target.dataset.id).then(loadRoles); }
  if (e.target.dataset.act === 'setRole' && can('users')) { sb.from('profiles').update({ role_id: e.target.value }).eq('id', e.target.dataset.id).then(({ error }) => error && fail(error)); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
[['fq', 'q'], ['fs', 's'], ['fp', 'p'], ['fd', 'd']].forEach(([el, k]) =>
  $(el).addEventListener(k === 'q' ? 'input' : 'change', e => { filters[k] = e.target.value; renderJobs(); }));

// Refresh countdowns when the date rolls over (e.g. page left open overnight)
setInterval(() => { if (today() !== shownDate) renderAll(); }, 60000);

document.addEventListener('visibilitychange', () => { if (!document.hidden) liveRefresh(); });
setInterval(() => { if (!document.hidden) liveRefresh(); }, 30000);   // safety net if live connection drops
initAuth();
</script>
