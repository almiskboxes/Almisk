<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALMISK CARTON BOXES – Production Control</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Nirmala UI","Noto Sans Bengali",Arial,sans-serif;background:#f6f5f2;color:#1c1917}
.kraft{background:#a8743f}
.tick{display:inline-flex;white-space:nowrap;animation:tick var(--d,20s) linear infinite}
.tick span{display:inline-block;min-width:100vw;padding-right:4rem}
.ticker-box:hover .tick{animation-play-state:paused}
@keyframes tick{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.tick{animation:none}}
button,select,input,textarea{font:inherit}
:focus-visible{outline:3px solid #a8743f;outline-offset:2px}
</style>
</head>
<body class="min-h-screen">
<header class="bg-white/95 backdrop-blur border-b border-stone-200 sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
    <div class="flex items-center gap-3 min-w-0">
      <div class="kraft w-11 h-11 rounded-xl flex items-center justify-center text-2xl shrink-0">📦</div>
      <div class="min-w-0"><h1 class="font-extrabold text-lg sm:text-2xl tracking-tight truncate">ALMISK CARTON BOXES</h1>
      <p class="text-xs sm:text-sm text-stone-500 truncate">Packaging Production Control</p></div>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <span id="todayLabel" class="hidden md:block text-sm font-semibold text-stone-600 mr-1"></span>
      <button id="btnAdd" data-act="add" class="kraft text-white font-bold rounded-xl px-4 py-3 shadow-sm hover:opacity-90">+ Add New Job</button>
      <div id="whoBar" class="relative flex items-center gap-2"></div>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-5 space-y-5">
  <section id="stats" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3"></section>
  <section class="grid lg:grid-cols-3 gap-5">
    <div class="lg:col-span-2 bg-white rounded-2xl border border-stone-200 p-4 shadow-sm">
      <h2 class="font-bold text-lg mb-3">⚠ Attention Required</h2>
      <div id="attention" class="space-y-2 max-h-96 overflow-y-auto"></div>
    </div>
    <div class="space-y-5">
      <div class="bg-white rounded-2xl border border-stone-200 p-4 shadow-sm"><h2 class="font-bold text-lg mb-3">Today's Production Overview</h2><div id="overview" class="grid grid-cols-2 gap-2"></div></div>
      <div class="bg-white rounded-2xl border border-stone-200 p-4 shadow-sm"><h2 class="font-bold text-lg mb-3">Recently Delivered</h2><div id="recent" class="space-y-2"></div></div>
    </div>
  </section>
  <section>
    <h2 class="font-bold text-xl mb-3">Production Jobs</h2>
    <div class="bg-white rounded-2xl border border-stone-200 p-3 shadow-sm grid gap-2 sm:grid-cols-2 lg:grid-cols-5 mb-4">
      <input id="fq" type="search" placeholder="Search jobs…" class="lg:col-span-2 border border-stone-300 rounded-xl px-3 py-3 w-full">
      <select id="fs" class="border border-stone-300 rounded-xl px-3 py-3 bg-white"><option value="all">Status: All</option><option value="pending">Pending</option><option value="running">Running</option><option value="finished">Finished</option><option value="delivered">Delivered</option><option value="hold">Hold</option></select>
      <select id="fp" class="border border-stone-300 rounded-xl px-3 py-3 bg-white"><option value="all">Priority: All</option><option value="urgent">Urgent</option><option value="normal">Normal</option></select>
      <select id="fd" class="border border-stone-300 rounded-xl px-3 py-3 bg-white"><option value="all">Delivery: All</option><option value="today">Due Today</option><option value="tomorrow">Due Tomorrow</option><option value="overdue">Overdue</option></select>
    </div>
    <div id="jobs" class="space-y-3"></div>
  </section>
  <footer id="adminFooter" class="flex flex-wrap gap-3 pt-2 pb-8">
    <button data-act="demo" class="border border-stone-300 bg-white rounded-xl px-4 py-3 font-semibold">Load Demo Data</button>
    <button data-act="clear" class="border border-red-300 text-red-700 bg-white rounded-xl px-4 py-3 font-semibold">Clear All Data</button>
  </footer>
</main>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/50 overflow-y-auto p-0 sm:p-6"><div id="modalBox" class="bg-white rounded-t-2xl sm:rounded-2xl max-w-2xl mx-auto mt-10 sm:mt-0 p-5 shadow-xl"></div></div>
<div id="ticker" class="fixed bottom-0 inset-x-0 z-40" style="display:none"></div>
<div id="auth" class="fixed inset-0 z-[60] bg-stone-100 items-center justify-center p-4" style="display:none"></div>

<script>
/* ---------- Setup ---------- */
const SUPABASE_URL = 'https://gcjkspgwjqployrwawfv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_2x7cM2LtyVw0WGUYbZOxDA_V7X1DpaU';
const EMAIL_DOMAIN = 'almisk.app';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let jobs = [], users = [], roles = [], notifs = [], reads = new Set(), me = null, notice = null;
let channel = null, rtTimer = null, menuOpen = false, delTouched = false, shownDate = '';
let filters = { q: '', s: 'all', p: 'all', d: 'all' };

const STATUS = {
  pending:   { label: 'Pending',   icon: '⏳', cls: 'bg-amber-100 text-amber-900 border-amber-300', next: ['running', 'Start Production'] },
  running:   { label: 'Running',   icon: '⚙️', cls: 'bg-blue-100 text-blue-900 border-blue-300',   next: ['finished', 'Mark Finished'] },
  finished:  { label: 'Finished',  icon: '✅', cls: 'bg-green-100 text-green-900 border-green-300', next: ['delivered', 'Mark Delivered'] },
  delivered: { label: 'Delivered', icon: '🚚', cls: 'bg-emerald-800 text-white border-emerald-900', next: null },
  hold:      { label: 'Hold',      icon: '⏸', cls: 'bg-red-100 text-red-900 border-red-300',       next: ['pending', 'Resume (Pending)'] }
};
const HERO = { pending: 'from-amber-500 to-amber-700', running: 'from-blue-600 to-blue-800', finished: 'from-green-600 to-green-800', delivered: 'from-emerald-700 to-emerald-950', hold: 'from-red-600 to-red-800' };
const FLOW = ['pending', 'running', 'finished', 'delivered'];
const TYPES = ['Box', 'Bag', 'Sleeve', 'Card', 'Sticker', 'Label', 'Paper Bag', 'Carton', 'Other'];
const UNITS = ['pcs', 'sets', 'kg', 'rolls', 'other'];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
function fail(e) { console.error(e); alert((e && e.message) || e); }

/* ---------- Permissions ---------- */
const PERMS = [['add','Add new jobs'],['edit','Edit jobs'],['delete','Delete jobs'],['s_pending','Set Pending'],['s_running','Set Running'],['s_finished','Set Finished'],['s_delivered','Set Delivered'],['s_hold','Set Hold'],['notice','Edit notice ticker'],['users','Manage users & roles'],['demo','Demo / clear data']];
const can = p => !!me && (me.role === 'admin' || ((roles.find(r => r.id === me.role) || { perms: [] }).perms.includes(p)));
const viewOnly = () => !!me && !can('add') && !can('edit') && !can('delete') && !Object.keys(STATUS).some(s => can('s_' + s));
const emailOf = u => u.includes('@') ? u : u + '@' + EMAIL_DOMAIN;

/* ---------- Language ---------- */
let lang = localStorage.getItem('almiskLang') === 'bn' ? 'bn' : 'en';
const LOC = () => lang === 'bn' ? 'bn-BD' : 'en-GB';
/* PASTE your existing Bangla dictionary here: replace the empty object below with your old
   "const BN = {...}" and its "Object.assign(BN, {...})" block. Add new strings if you like. */
const BN = {};
const t = s => lang === 'bn' ? (BN[s] ?? s) : s;
const digits = x => x.replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
function translateDom(root = document.body) {
  const bn = lang === 'bn', w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT); let n;
  while ((n = w.nextNode())) {
    if (/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName)) continue;
    if (n._o === undefined) { if (!bn) continue; n._o = n.nodeValue; }
    if (!bn) { n.nodeValue = n._o; continue; }
    const m = n._o.match(/^([^A-Za-z0-9]*)(.*?)(\s*)$/s);
    n.nodeValue = digits(m[1] + (BN[m[2]] ?? m[2]) + m[3]);
  }
  root.querySelectorAll('[placeholder]').forEach(el => {
    if (el._p === undefined) el._p = el.placeholder;
    el.placeholder = bn ? digits(BN[el._p] ?? el._p) : el._p;
  });
}
function setLang(l) { lang = l; localStorage.setItem('almiskLang', l); document.documentElement.lang = l; closeModal(); me ? renderAll() : showAuth(); translateDom(); }

/* ---------- Dates (local, no UTC drift) ---------- */
const toDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const utc = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((utc(a) - utc(b)) / 864e5);
const showDate = s => s ? toDate(s).toLocaleDateString(LOC(), { day: '2-digit', month: 'short', year: 'numeric' }) : '—';

/* ---------- Data layer ---------- */
const fromRow = r => ({ id: r.id, companyName: r.company_name, items: r.items || [], orderDate: r.order_date, deliveryDate: r.delivery_date, priority: r.priority, status: r.status, note: r.note || '', createdBy: r.created_by, history: r.history || [], finishedOn: r.finished_on, deliveredOn: r.delivered_on, createdAt: r.created_at, updatedAt: r.updated_at });
const toRow = d => ({ company_name: d.companyName, items: d.items, order_date: d.orderDate, delivery_date: d.deliveryDate, priority: d.priority, status: d.status, note: d.note });
async function loadJobs() { const { data, error } = await sb.from('jobs').select('*'); if (error) return fail(error); jobs = data.map(fromRow); }
async function loadRoles() { const { data, error } = await sb.from('roles').select('*').order('locked', { ascending: false }).order('name'); if (error) return fail(error); roles = data; }
async function loadUsers() { const { data } = await sb.from('profiles').select('*').order('created_at'); users = (data || []).map(p => ({ id: p.id, userId: p.user_id, name: p.name, role: p.role_id, approved: p.approved })); }
async function loadNotice() { const { data } = await sb.from('notice').select('*').eq('id', 1).maybeSingle(); notice = data && data.text ? { text: data.text, urgent: data.urgent, by: data.by_name } : null; }
async function loadNotifs() {
  const [n, r] = await Promise.all([sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(50), sb.from('notif_reads').select('notif_id').eq('user_id', me.id)]);
  notifs = (n.data || []).map(x => ({ id: x.id, type: x.type, jobId: x.job_id, company: x.company, status: x.status, by: x.by_name, at: x.created_at }));
  reads = new Set((r.data || []).map(x => x.notif_id));
}
async function refreshData() {
  const { data: p } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  if (!p || !p.approved) { await logout(t('Your account is not active. Ask the Admin.')); return; }
  me.role = p.role_id; me.name = p.name;
  await Promise.all([loadJobs(), loadRoles(), loadNotice(), loadNotifs()]);
  if (can('users')) await loadUsers();
}
function subscribe() {
  if (channel) return;
  channel = sb.channel('almisk-live').on('postgres_changes', { event: '*', schema: 'public' }, () => { clearTimeout(rtTimer); rtTimer = setTimeout(liveRefresh, 300); }).subscribe();
}
async function liveRefresh() {
  if (!me) return;
  const seen = new Set(notifs.map(n => n.id));
  await refreshData(); if (!me) return;
  renderAll();
  notifs.filter(n => !seen.has(n.id) && !reads.has(n.id)).forEach(n => toast(ntext(n)));
}

/* ---------- Auth ---------- */
function clearUi() { $('whoBar').innerHTML = ''; $('btnAdd').style.display = 'none'; $('adminFooter').style.display = 'none'; renderTicker(); }
function showAuth(msg) {
  const a = $('auth'), i = 'border border-stone-300 rounded-xl px-3 py-3 w-full'; a.style.display = 'flex';
  a.innerHTML = `<form id="authForm" class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm space-y-3">
    <div class="text-center"><div class="kraft w-14 h-14 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-2">📦</div><h2 class="font-extrabold text-xl">ALMISK CARTON BOXES</h2><p class="text-sm text-stone-600">Sign in to continue</p></div>
    <input id="aUid" class="${i}" placeholder="User ID or email" autocomplete="username" autocapitalize="none">
    <input id="aPw" type="password" class="${i}" placeholder="Password" autocomplete="current-password">
    <p id="authErr" class="text-red-700 text-sm font-semibold">${esc(msg || '')}</p>
    <button class="kraft text-white font-bold rounded-xl px-4 py-3 w-full">Sign In</button>
    <button type="button" data-act="lang" class="text-sm text-stone-500 w-full">${lang === 'bn' ? 'English' : 'বাংলা'}</button></form>`;
  translateDom(a);
  $('authForm').onsubmit = async e => {
    e.preventDefault();
    const uid = $('aUid').value.trim().toLowerCase(), pw = $('aPw').value, err = $('authErr'), b = e.submitter;
    if (!uid || !pw) { err.textContent = t('Enter your user ID and password.'); return; }
    b.disabled = true;
    const { data, error } = await sb.auth.signInWithPassword({ email: emailOf(uid), password: pw });
    b.disabled = false;
    if (error) { err.textContent = t('Wrong user ID or password.'); return; }
    await enter(data.user);
  };
}
async function enter(user) {
  const { data: p } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
  if (!p || !p.approved) { await sb.auth.signOut(); me = null; showAuth(t('Your account is not active. Ask the Admin.')); return; }
  me = { id: p.id, name: p.name, userId: p.user_id, role: p.role_id };
  $('auth').style.display = 'none'; $('auth').innerHTML = '';
  await refreshData(); renderAll(); subscribe();
}
async function initAuth() {
  document.documentElement.lang = lang;
  sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' && me) { me = null; clearUi(); showAuth(); } });
  const { data } = await sb.auth.getSession();
  data.session ? enter(data.session.user) : showAuth();
}
async function logout(msg) {
  me = null; menuOpen = false; closeModal(); clearUi();
  if (channel) { sb.removeChannel(channel); channel = null; }
  await sb.auth.signOut(); showAuth(typeof msg === 'string' ? msg : '');
}
async function changePassword() {
  const pw = prompt(t('New password (6+ characters):')); if (!pw) return;
  if (pw.length < 6) return alert(t('Password must be at least 6 characters.'));
  const { error } = await sb.auth.updateUser({ password: pw });
  alert(error ? error.message : t('Password updated.'));
}

/* ---------- Corner account menu ---------- */
function renderWho() {
  const r = roles.find(x => x.id === me.role), un = notifs.filter(n => !reads.has(n.id)).length;
  const ini = esc(me.name.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase());
  const it = 'w-full text-left px-4 py-3 text-sm font-semibold hover:bg-stone-50 flex items-center gap-3';
  $('whoBar').innerHTML = `
    <button data-act="notifs" aria-label="Notifications" class="relative w-11 h-11 rounded-full border border-stone-200 bg-white text-lg">🔔${un ? `<span class="absolute -top-1 -right-1 bg-red-600 text-white text-xs rounded-full min-w-[1.25rem] h-5 px-1 flex items-center justify-center">${un}</span>` : ''}</button>
    <button data-act="menu" aria-label="Account menu" aria-expanded="${menuOpen}" class="kraft w-11 h-11 rounded-full text-white font-extrabold">${ini}</button>
    <div class="${menuOpen ? '' : 'hidden'} absolute right-0 top-14 w-64 bg-white border border-stone-200 rounded-2xl shadow-xl overflow-hidden z-50">
      <div class="px-4 py-3 bg-stone-50 border-b border-stone-200"><div class="font-bold truncate">${esc(me.name)}</div><div class="text-xs text-stone-500">${esc(r ? r.name : me.role)}${viewOnly() ? ' · 👁 View only' : ''}</div></div>
      <button data-act="lang" class="${it}">🌐 ${lang === 'bn' ? 'English' : 'বাংলা'}</button>
      ${can('users') ? `<button data-act="users" class="${it}">👥 Users &amp; Roles</button>` : ''}
      <button data-act="chgPw" class="${it}">🔑 Password</button>
      <button data-act="logout" class="${it} text-red-700 border-t border-stone-200">⎋ Sign out</button>
    </div>`;
  $('btnAdd').style.display = can('add') ? '' : 'none';
  $('adminFooter').style.display = can('demo') ? '' : 'none';
}

/* ---------- Users & roles ---------- */
async function openUsers(msg) {
  if (can('users')) await loadUsers();
  const ro = s => roles.map(r => `<option value="${r.id}" ${r.id === s ? 'selected' : ''}>${esc(r.name)}</option>`).join('');
  const i = 'border border-stone-300 rounded-xl px-3 py-2 w-full bg-white', b = 'border border-stone-300 rounded-lg px-3 py-2 font-semibold bg-white';
  openModal(`<div class="flex justify-between"><h3 class="text-xl font-bold">Users &amp; Roles</h3><button data-act="close" aria-label="Close" class="text-2xl text-stone-500">✕</button></div>
    <p class="text-red-700 text-sm font-semibold mt-1">${esc(msg || '')}</p>
    <h4 class="font-bold mt-3 mb-2">Users</h4><div class="space-y-2">${users.map(u => `<div class="border border-stone-200 rounded-xl p-3 flex flex-wrap items-center gap-2">
      <div class="flex-1 min-w-[8rem]"><b>${esc(u.name)}</b><div class="text-xs text-stone-500">ID: ${esc(u.userId)}${u.approved ? '' : ' · ' + t('Disabled')}</div></div>
      <select data-act="setRole" data-id="${u.id}" class="border border-stone-300 rounded-lg px-2 py-2 bg-white" ${u.id === me.id ? 'disabled' : ''}>${ro(u.role)}</select>
      ${u.id === me.id ? '' : u.approved ? `<button data-act="delUser" data-id="${u.id}" class="${b} text-red-700">Disable</button>` : `<button data-act="enableUser" data-id="${u.id}" class="${b}">Enable</button>`}</div>`).join('')}</div>
    <p class="text-sm text-stone-600 mt-3">Create staff accounts in Supabase → Authentication → Users → Add user (use userid@${EMAIL_DOMAIN}). Then approve them here and set a role.</p>
    <h4 class="font-bold mt-5 mb-2">Roles</h4><div class="space-y-2">${roles.map(r => `<div class="border border-stone-200 rounded-xl p-3 flex items-center gap-2">
      <div class="flex-1 text-sm"><b>${esc(r.name)}</b><div class="text-stone-500">${r.locked ? 'Full access' : r.perms.length ? r.perms.map(k => t(PERMS.find(p => p[0] === k)[1])).join(', ') : 'View only'}</div></div>
      <label class="flex items-center gap-1 text-sm"><input type="checkbox" data-act="roleNotify" data-id="${r.id}" class="w-5 h-5" ${r.notify !== false ? 'checked' : ''}>Receives notifications</label>
      ${r.locked ? '' : `<button data-act="delRole" data-id="${r.id}" class="${b} text-red-700">Delete</button>`}</div>`).join('')}</div>
    <h4 class="font-bold mt-4 mb-2">Create a role</h4><input id="rName" class="${i}" placeholder="Role name, e.g. Delivery Driver">
    <div class="grid grid-cols-2 gap-1 mt-2 text-sm">${PERMS.map(p => `<label class="flex items-center gap-2 py-1"><input type="checkbox" class="rp w-5 h-5" value="${p[0]}">${p[1]}</label>`).join('')}</div>
    <label class="flex items-center gap-2 text-sm mt-2"><input type="checkbox" id="rNotify" class="w-5 h-5" checked>Receives notifications</label>
    <button data-act="addRole" class="kraft text-white rounded-xl px-4 py-2 font-bold mt-2">Add Role</button>`);
}
async function addRole() {
  const name = $('rName').value.trim(); if (!name) return openUsers(t('Enter a role name.'));
  const { error } = await sb.from('roles').insert({ id: 'r' + Date.now(), name, notify: $('rNotify').checked, perms: [...document.querySelectorAll('.rp:checked')].map(c => c.value) });
  await loadRoles(); renderAll(); openUsers(error ? error.message : '');
}
async function delRole(id) {
  if (users.some(u => u.role === id)) return openUsers(t('This role is assigned to a user. Change their role first.'));
  const { error } = await sb.from('roles').delete().eq('id', id); await loadRoles(); openUsers(error ? error.message : '');
}

/* ---------- Notice ticker & notifications ---------- */
function renderTicker() {
  const el = $('ticker'), has = !!(notice && notice.text), edit = can('notice');
  if (!me || (!has && !edit)) { el.style.display = 'none'; document.body.style.paddingBottom = ''; return; }
  el.style.display = 'block'; document.body.style.paddingBottom = '56px';
  const urgent = has && notice.urgent, txt = has ? esc(notice.text) : '';
  el.innerHTML = `<div class="flex items-stretch ${urgent ? 'bg-red-700' : 'bg-stone-900'} text-white shadow-[0_-2px_8px_rgba(0,0,0,.25)]">
    <div class="shrink-0 px-3 flex items-center font-bold ${urgent ? 'bg-red-900' : 'kraft'}">${urgent ? '🚨' : '📢'} Notice</div>
    <div class="flex-1 overflow-hidden py-3 ticker-box">${has ? `<div class="tick" style="--d:${Math.max(12, Math.round(notice.text.length * 0.2))}s"><span>${txt}</span><span aria-hidden="true">${txt}</span></div>` : '<span class="opacity-70 px-3 text-sm">No notice yet.</span>'}</div>
    ${edit ? '<button data-act="notice" aria-label="Edit notice" class="shrink-0 px-4 font-semibold bg-black/30">✎ Edit</button>' : ''}</div>`;
}
function openNoticeForm() {
  openModal(`<h3 class="text-xl font-bold mb-3">Notice</h3><textarea id="nText" rows="3" class="border border-stone-300 rounded-xl px-3 py-3 w-full" placeholder="Notice text">${esc(notice ? notice.text : '')}</textarea>
    <label class="flex items-center gap-2 mt-3"><input type="checkbox" id="nUrgent" class="w-5 h-5" ${notice && notice.urgent ? 'checked' : ''}>Mark as urgent</label>
    <div class="flex flex-wrap gap-3 justify-end mt-4"><button data-act="close" class="border border-stone-300 rounded-xl px-5 py-3 font-semibold">Cancel</button>

/* ---------- Business logic ---------- */
const remaining = j => dayDiff(j.deliveryDate, today());

  const d = remaining(j);
  if (d < 0) return { text: `${-d} ${-d === 1 ? 'DAY' : 'DAYS'} OVERDUE`, cls: 'text-red-700' };
  if (d === 0) return { text: 'DUE TODAY', cls: 'text-orange-700' };
  return { text: `${d} ${d === 1 ? 'DAY' : 'DAYS'} LEFT`, cls: d === 1 ? 'text-amber-700' : 'text-stone-700' };
}
function autoNote(j) {
  const d = remaining(j);
  switch (j.status) {
    case 'pending': return d < 0 ? 'Delivery date has passed. Please prioritize this production immediately.' : d === 0 ? 'Please start the production. Delivery is due today.' : `Please start the production. We have ${d} ${d === 1 ? 'day' : 'days'} remaining before the delivery date.`;
    case 'running': return d < 0 ? 'Production is running but the delivery date has passed. Please finish immediately.' : d === 0 ? 'Production is running and the delivery is due today. Please prioritize completion.' : `Thanks for starting the production on time. We have ${d} ${d === 1 ? 'day' : 'days'} remaining.`;
    case 'finished': return (j.finishedOn || today()) <= j.deliveryDate ? 'Thanks for finishing the job on time. Ready for delivery.' : 'Job finished, but the delivery deadline was missed.';
    case 'delivered': return (j.deliveredOn || today()) <= j.deliveryDate ? 'Thanks for delivering the order on time.' : 'Order delivered, but the delivery deadline was missed.';
    default: return 'Please don’t start production before everything is confirmed.';

}
// Order: overdue, urgent, then Pending/Running/Hold, Finished, Delivered; then nearest delivery, then oldest.
const rank = j => j.status === 'delivered' ? 4 : isOver(j) ? 0 : j.priority === 'urgent' && j.status !== 'finished' ? 1 : j.status === 'finished' ? 3 : 2;

    if (filters.d !== 'all') {

    }

  });
}

const ALLOWED = new Set(['image/jpeg', 'image/png', 'image/webp', 'application/pdf']), EXT = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'application/pdf': 'pdf' };

async function listAttachments(id) { const { data, error } = await sb.from('job_attachments').select('*').eq('job_id', id).order('created_at'); if (error) throw error; return data || []; }
async function fileLink(p) { const { data, error } = await sb.storage.from('job-attachments').createSignedUrl(p, 3600); if (error) throw error; return data.signedUrl; }
async function loadJobAttachments(id) {
  if (!$('jobFiles')) return;

    const fs = await Promise.all((await listAttachments(id)).map(async f => ({ ...f, url: await fileLink(f.storage_path) }))), h = $('jobFiles'); if (!h) return;
    h.innerHTML = fs.length ? fs.map(f => `<div class="border rounded-xl p-3 flex flex-wrap gap-3 items-center">
      ${f.mime_type.startsWith('image/') ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer"><img src="${esc(f.url)}" class="w-24 h-24 object-contain bg-stone-100 rounded" alt="${esc(f.original_name)}"></a>` : '<span class="text-3xl">📄</span>'}

      ${canRmFile() ? `<button data-act="removeAttachment" data-id="${esc(id)}" data-file="${esc(f.id)}" class="text-red-700 font-semibold border border-red-200 px-3 py-2 rounded-lg">Remove</button>` : ''}</div>`).join('') : '<p>No attachments for this job yet.</p>';
  } catch (e) { if ($('jobFiles')) $('jobFiles').textContent = 'Could not load attachments: ' + e.message; }
}
const fileProblem = fs => { for (const f of fs) if (!ALLOWED.has(f.type) || !f.size || f.size > 10485760) return `Invalid file: ${f.name} (JPG, PNG, WEBP, PDF; maximum 10 MB).`; return ''; };
async function putFiles(id, fs) {
  let ok = 0;
  for (const f of fs) {
    const path = `${id}/${crypto.randomUUID()}.${EXT[f.type]}`;
    try {
      const { error: e1 } = await sb.storage.from('job-attachments').upload(path, f, { contentType: f.type, upsert: false }); if (e1) throw e1;
      const { error: e2 } = await sb.from('job_attachments').insert({ job_id: id, storage_path: path, original_name: f.name.slice(0, 240), mime_type: f.type, size_bytes: f.size });
      if (e2) { await sb.storage.from('job-attachments').remove([path]); throw e2; } ok++;
    } catch (e) { return `${ok} of ${fs.length} file(s) uploaded; failed on ${f.name}: ${e.message}`; }
  }
  return '';
}
function previewFiles(list) {
  const box = $('fPrev'); if (!box) return;
  box.innerHTML = [...list].map(f => { const good = ALLOWED.has(f.type) && f.size > 0 && f.size <= 10485760;
    return `<div class="w-20 text-center text-xs ${good ? '' : 'text-red-700'}">${f.type.startsWith('image/') ? `<img src="${URL.createObjectURL(f)}" class="w-20 h-20 object-cover rounded-lg border border-stone-200" alt="">` : '<div class="w-20 h-20 rounded-lg border border-stone-200 flex items-center justify-center text-2xl bg-stone-50">📄</div>'}<div class="truncate">${esc(f.name)}</div>${good ? '' : '<div>Not allowed</div>'}</div>`; }).join('');
}
async function uploadJobAttachments(id, sel) {
  if (!canUpload()) return; const files = [...sel], msg = $('uploadMsg'); if (!files.length) return;
  for (const f of files) if (!ALLOWED.has(f.type) || !f.size || f.size > 10485760) { if (msg) msg.textContent = `Invalid file: ${f.name} (JPG, PNG, WEBP, PDF; maximum 10 MB).`; return; }
  if (msg) msg.textContent = `Uploading ${files.length} file(s)…`; let ok = 0;
  for (const f of files) {
    const path = `${id}/${crypto.randomUUID()}.${EXT[f.type]}`;
    try {
      const { error: e1 } = await sb.storage.from('job-attachments').upload(path, f, { contentType: f.type, upsert: false }); if (e1) throw e1;
      const { error: e2 } = await sb.from('job_attachments').insert({ job_id: id, storage_path: path, original_name: f.name.slice(0, 240), mime_type: f.type, size_bytes: f.size });
      if (e2) { await sb.storage.from('job-attachments').remove([path]); throw e2; } ok++;
    } catch (e) { if (msg) msg.textContent = `Uploaded ${ok}. Failed on ${f.name}: ${e.message}`; await loadJobAttachments(id); return; }
  }

}
async function deleteAttachment(fileId, jobId) {

  try {

    const { error: e1 } = await sb.storage.from('job-attachments').remove([f.storage_path]); if (e1) throw e1;
    const { error: e2 } = await sb.from('job_attachments').delete().eq('id', f.id); if (e2) throw e2;
    await loadJobAttachments(jobId);
  } catch (e) { fail(e); }

      const { error: e2 } = await sb.from('job_attachments').delete().eq('job_id', id); if (e2) throw e2;

  } catch (e) { fail(e); return false; }
}
